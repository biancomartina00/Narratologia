<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Narratologia Interattiva</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Fraunces', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>
  <style>
    :root {
      --bg-page: #f5f7fb;
      --text-main: #1e293b;
      --text-muted: #475569;
    }

    html {
      font-size: 16px;
      transition: font-size 0.2s ease;
    }

    /* Modalità LIM: ingrandisce proporzionalmente TUTTO il testo, titoli, brani, riquadri e bottoni */
    html.lim-mode {
      font-size: 21px;
    }

    body {
      background: linear-gradient(180deg, #f3f6fc 0%, #faf8f5 50%, #f4f7fb 100%);
      color: var(--text-main);
      font-family: 'Inter', system-ui, sans-serif;
      overflow-x: hidden;
    }

    html.lim-mode body {
      background: #ffffff;
      color: #0f172a;
    }

    html.lim-mode .prose-box p,
    html.lim-mode .prose-box li,
    html.lim-mode .prose-box div {
      line-height: 1.75;
    }

    html.lim-mode button {
      min-height: 48px;
      padding-top: 0.65rem;
      padding-bottom: 0.65rem;
    }

    .glossary-term {
      font-weight: 700;
      background-color: #fef3c7;
      color: #78350f;
      padding: 0.08rem 0.42rem;
      border-radius: 0.45rem;
      border-bottom: 2px solid #f59e0b;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline;
    }

    .glossary-term:hover {
      background-color: #fde68a;
      color: #451a03;
    }

    html.lim-mode .glossary-term {
      background-color: #fef08a;
      color: #0f172a;
      border-bottom: 3px solid #0f172a;
    }

    .snippet-highlight {
      font-weight: 600;
      padding: 0.12rem 0.42rem;
      border-radius: 0.45rem;
      cursor: pointer;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
      border: 1px solid rgba(15, 23, 42, 0.16);
      display: inline;
    }

    .snippet-highlight:hover {
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(15, 23, 42, 0.12);
    }

    .snippet-highlight.active {
      outline: 2.5px solid #1e3a8a;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.28);
    }

    .chip-sky { background-color: #dff2fe; color: #075985; }
    .chip-mint { background-color: #d3f9e8; color: #065f46; }
    .chip-amber { background-color: #fef3c7; color: #92400e; }
    .chip-peach { background-color: #ffedd5; color: #9a3412; }
    .chip-lavender { background-color: #ede9fe; color: #5b21b6; }
    .chip-rose { background-color: #ffe4e6; color: #9f1239; }

    /* Tooltip hover/click per lessico misto di Gadda */
    .hover-note-wrapper {
      position: relative;
      display: inline-block;
    }

    .hover-note-badge {
      visibility: hidden;
      opacity: 0;
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background-color: #1e293b;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.65rem;
      border-radius: 0.5rem;
      white-space: nowrap;
      z-index: 30;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      transition: opacity 0.15s ease, visibility 0.15s ease;
      pointer-events: none;
    }

    .hover-note-wrapper:hover .hover-note-badge,
    .hover-note-wrapper.open .hover-note-badge {
      visibility: visible;
      opacity: 1;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <!-- Barra superiore -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-indigo-100 shadow-xs">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <!-- Icona e Titolo -->
      <div class="flex items-center gap-3 min-w-0">
        <button
          id="brandHomeBtn"
          type="button"
          class="flex items-center gap-3 text-left group focus:outline-none cursor-pointer"
          title="Torna al Modulo 1"
        >
          <span class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 text-white flex items-center justify-center shadow-sm group-hover:from-indigo-700 group-hover:to-violet-700 transition shrink-0">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              <path d="M12 6l4 4-6 6H6v-4l6-6z"></path>
            </svg>
          </span>
          <div class="truncate">
            <h1 class="font-serif text-lg sm:text-xl font-bold text-slate-900 tracking-tight truncate">
              Narratologia Interattiva
            </h1>
            <p class="text-xs text-slate-500 hidden sm:block">
              Laboratorio didattico in 10 moduli, glossario e quiz
            </p>
          </div>
        </button>
      </div>

      <!-- Pulsanti Modalità LIM e Glossario -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button
          id="limToggleBtn"
          type="button"
          aria-pressed="false"
          class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-sky-300 bg-sky-50 text-sky-900 hover:bg-sky-100 transition flex items-center gap-2 cursor-pointer"
        >
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <span id="limToggleLabel">Modalità LIM</span>
        </button>

        <button
          id="openGlossaryBtn"
          type="button"
          class="px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold bg-amber-500 text-slate-950 hover:bg-amber-400 transition shadow-xs flex items-center gap-2 cursor-pointer"
        >
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
          </svg>
          <span>Glossario</span>
        </button>
      </div>
    </div>

    <!-- Barra secondaria dei moduli + Quiz -->
    <nav aria-label="Navigazione moduli e quiz" class="border-t border-slate-100 bg-slate-50/90">
      <div
        id="secondaryNav"
        class="max-w-7xl mx-auto px-3 sm:px-6 py-2 flex items-center gap-1.5 sm:gap-2 overflow-x-auto no-scrollbar"
      ></div>
    </nav>
  </header>

  <!-- Area principale -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 py-6 sm:py-8">
    <div id="statusToast" class="hidden mb-4 rounded-2xl bg-indigo-950 text-white px-4 py-2.5 text-sm shadow-md flex items-center justify-between gap-3">
      <span id="statusToastText"></span>
      <button id="closeToastBtn" type="button" class="text-indigo-200 hover:text-white text-xs font-semibold px-2 py-1 cursor-pointer">Chiudi</button>
    </div>

    <section id="moduleContainer" class="space-y-6"></section>

    <footer id="moduleFooterNav" class="mt-10 pt-6 border-t border-slate-200 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4"></footer>
  </main>

  <!-- Pop-up Glossario per parole in grassetto -->
  <div
    id="termPopup"
    role="dialog"
    aria-modal="false"
    aria-labelledby="termPopupTitle"
    class="hidden fixed bottom-5 right-5 z-50 w-[calc(100vw-2.5rem)] max-w-md bg-amber-50 border-2 border-amber-400 rounded-2xl shadow-2xl p-5 transition-all"
  >
    <div class="flex items-start justify-between gap-3 mb-2">
      <div>
        <span class="inline-block text-[11px] uppercase tracking-wider font-bold text-amber-900 bg-amber-200/80 px-2.5 py-0.5 rounded-full mb-1">
          Glossario
        </span>
        <h3 id="termPopupTitle" class="font-serif text-xl font-bold text-slate-900"></h3>
      </div>
      <button
        id="closeTermPopupBtn"
        type="button"
        aria-label="Chiudi definizione"
        class="p-1.5 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-amber-200/60 transition cursor-pointer"
      >
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"></path>
        </svg>
      </button>
    </div>
    <p id="termPopupDef" class="text-sm sm:text-base text-slate-800 leading-relaxed mb-4"></p>
    <div class="flex items-center justify-between gap-2 pt-3 border-t border-amber-200/80">
      <span id="termPopupModule" class="text-xs font-semibold text-amber-900"></span>
      <button
        id="termPopupOpenGlossaryBtn"
        type="button"
        class="text-xs sm:text-sm font-bold text-indigo-700 hover:text-indigo-900 underline underline-offset-4 cursor-pointer"
      >
        Apri nel Glossario completo →
      </button>
    </div>
  </div>

  <!-- Modale Glossario Completo -->
  <div
    id="glossaryModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="glossaryModalTitle"
    class="hidden fixed inset-0 z-50 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6"
  >
    <div class="bg-white rounded-3xl border border-indigo-100 shadow-2xl w-full max-w-4xl max-h-[88vh] flex flex-col overflow-hidden">
      <div class="px-5 sm:px-6 py-4 bg-gradient-to-r from-indigo-700 to-violet-700 text-white flex items-center justify-between gap-4">
        <div>
          <h2 id="glossaryModalTitle" class="font-serif text-xl sm:text-2xl font-bold">
            Glossario della Narratologia
          </h2>
          <p class="text-xs sm:text-sm text-indigo-100">
            Tutti i concetti chiave evidenziati nei moduli
          </p>
        </div>
        <button
          id="closeGlossaryBtn"
          type="button"
          aria-label="Chiudi glossario"
          class="p-2 rounded-xl text-indigo-100 hover:text-white hover:bg-white/15 transition cursor-pointer"
        >
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="p-4 sm:p-5 border-b border-slate-200 bg-slate-50 flex flex-col sm:flex-row gap-3">
        <input
          id="glossarySearchInput"
          type="search"
          placeholder="Cerca una parola o un concetto (es. fabula, focalizzazione, ellissi, paratassi)..."
          class="flex-1 px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-sm sm:text-base text-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <select
          id="glossaryModuleFilter"
          aria-label="Filtra per modulo"
          class="px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm text-slate-800 font-medium focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="all">Tutti i moduli</option>
        </select>
      </div>

      <div id="glossaryList" class="p-5 sm:p-6 overflow-y-auto space-y-3 flex-1"></div>
    </div>
  </div>

  <script>
    /**
     * Dati del Glossario
     */
    const GLOSSARY_ENTRIES = [
      {
        id: 'testo',
        term: 'Testo',
        module: 'Modulo 1',
        definition: 'Dal latino textus ("tessuto"), indica un insieme di informazioni interconnesse e organizzate secondo regole condivise, come fili intrecciati e annodati tra loro seguendo schemi precisi per ottenere un abito.'
      },
      {
        id: 'coerenza',
        term: 'Coerenza',
        module: 'Modulo 1',
        definition: 'Regola condivisa del testo per cui i legami tra le idee e i contenuti non devono presentare contraddizioni: deve esserci un filo logico che lega le informazioni del racconto.'
      },
      {
        id: 'coesione',
        term: 'Coesione',
        module: 'Modulo 1',
        definition: 'Regola condivisa del testo per cui le parole sono collegate tra loro secondo le regole grammaticali della lingua in cui il testo è scritto.'
      },
      {
        id: 'adeguatezza',
        term: 'Adeguatezza',
        module: 'Modulo 1',
        definition: 'Regola condivisa del testo legata al destinatario (pubblico a cui si rivolge l\'opera), al contesto (situazione in cui avviene la comunicazione) e allo scopo (obiettivo della comunicazione).'
      },
      {
        id: 'narratologia',
        term: 'Narratologia',
        module: 'Modulo 1',
        definition: 'Disciplina nata alla fine degli anni Sessanta del Novecento che si occupa di analizzare le forme e le strutture della narrazione, fornendo strumenti che smontano il testo e aiutano a comprenderne i meccanismi di funzionamento.'
      },
      {
        id: 'ts',
        term: 'Tempo della storia (TS)',
        module: 'Modulo 2',
        definition: 'Durata effettiva degli avvenimenti nel mondo narrato, cioè l\'arco temporale che occupano gli eventi.'
      },
      {
        id: 'tr',
        term: 'Tempo del racconto (TR)',
        module: 'Modulo 2',
        definition: 'Tempo che l\'autore attribuisce alla vicenda in termini di parole, righe o pagine (il tempo che il lettore impiega a leggere o a seguire con lo sguardo quegli stessi eventi così come narratore o regista scelgono di presentarli).'
      },
      {
        id: 'durata',
        term: 'Durata',
        module: 'Modulo 2',
        definition: 'Rapporto che si stabilisce nel testo narrativo tra il tempo della storia (TS) e il tempo del racconto (TR); attraverso diverse tecniche il narratore può alterare il ritmo della narrazione.'
      },
      {
        id: 'sommario',
        term: 'Sommario o riassunto',
        module: 'Modulo 2',
        definition: 'Tecnica di velocizzazione del ritmo (TS > TR): sintesi in poche righe di periodi di tempo anche molto lunghi.'
      },
      {
        id: 'ellissi',
        term: 'Ellissi',
        module: 'Modulo 2',
        definition: 'Tecnica di velocizzazione del ritmo (TS > TR): omissione di periodi di tempo, anche molto lunghi (salto temporale), talvolta introdotta da indicatori temporali come "molti giorni dopo", "trascorsi molti anni", "passarono parecchi mesi".'
      },
      {
        id: 'analisi',
        term: 'Analisi',
        module: 'Modulo 2',
        definition: 'Tecnica di rallentamento del ritmo (TS < TR): l\'autore esamina un avvenimento nel dettaglio, ad esempio riferendo i pensieri di un personaggio che durano pochi secondi ma occupano diverse righe o pagine.'
      },
      {
        id: 'pausa',
        term: 'Pausa (TS = 0)',
        module: 'Modulo 2',
        definition: 'Tecnica di rallentamento in cui il tempo del racconto si ferma del tutto (TS = 0): accade quando si inserisce una descrizione o una riflessione del narratore, sospendendo l\'azione principale e creando spesso suspense.'
      },
      {
        id: 'scena',
        term: 'Scena',
        module: 'Modulo 2',
        definition: 'Momento in cui il tempo del racconto e il tempo della storia si equivalgono (TS = TR) e il lettore partecipa quasi in presa diretta all\'azione, come accade di solito nel discorso diretto.'
      },
      {
        id: 'fabula',
        term: 'Fabula',
        module: 'Modulo 3',
        definition: 'Dal termine latino che significa "racconto", è la narrazione degli eventi in ordine logico-cronologico (come nelle cronache giornalistiche o nelle ricostruzioni giudiziarie).'
      },
      {
        id: 'intreccio',
        term: 'Intreccio',
        module: 'Modulo 3',
        definition: 'Ordine in cui il narratore decide di narrare gli eventi, che può coincidere con la fabula o discostarsene per creare suspense, mistero o colpi di scena.'
      },
      {
        id: 'anacronie',
        term: 'Anacronie narrative',
        module: 'Modulo 3',
        definition: 'Dal greco ana ("contro") + chronos ("tempo"), sono le alterazioni dell\'ordine naturale degli eventi (fabula vs intreccio) realizzate tramite flashback/analessi o flashforward/prolessi.'
      },
      {
        id: 'flashback',
        term: 'Flashback o analessi',
        module: 'Modulo 3',
        definition: 'Interruzione del flusso degli eventi per raccontare qualcosa che è accaduto in un momento precedente a ciò che si sta narrando.'
      },
      {
        id: 'flashforward',
        term: 'Flashforward o prolessi',
        module: 'Modulo 3',
        definition: 'Interruzione del flusso degli eventi per anticipare il racconto di un episodio che si verificherà successivamente.'
      },
      {
        id: 'sequenza',
        term: 'Sequenza',
        module: 'Modulo 4',
        definition: 'Porzione di testo autonoma sul piano del contenuto, riassumibile con una breve frase. Si divide in macrosequenze (nuclei fondamentali) e microsequenze (suddivisione più dettagliata).'
      },
      {
        id: 'patto-narrativo',
        term: 'Patto narrativo',
        module: 'Modulo 5',
        definition: 'Legame di fiducia tra autore e lettore: l\'autore propone regole e coerenza interna, il lettore accetta la finzione (sospensione dell\'incredulità) per vivere il racconto.'
      },
      {
        id: 'sospensione-incredulita',
        term: 'Sospensione dell\'incredulità',
        module: 'Modulo 5',
        definition: 'Atteggiamento del lettore che mette da parte il principio di realtà per seguire la storia, pur sapendo che è inventata.'
      },
      {
        id: 'omodiegetico',
        term: 'Narratore interno o omodiegetico',
        module: 'Modulo 5',
        definition: 'Voce narrante che appartiene a uno dei personaggi della storia, come protagonista o come personaggio secondario testimone.'
      },
      {
        id: 'onnisciente',
        term: 'Narratore onnisciente',
        module: 'Modulo 5',
        definition: 'Narratore che sa tutto, legge nel pensiero dei personaggi, conosce passato e futuro, sogni, sentimenti e progetti, e può commentare o giudicare eventi storici e sociali.'
      },
      {
        id: 'eterodiegetico',
        term: 'Narratore esterno o eterodiegetico',
        module: 'Modulo 5',
        definition: 'Voce narrante esterna alla vicenda che racconta la storia in terza persona senza prendervi parte come personaggio; può essere palese o nascosto.'
      },
      {
        id: 'inattendibile',
        term: 'Narratore inattendibile',
        module: 'Modulo 5',
        definition: 'Narratore di cui non possiamo fidarci: può dare informazioni parziali, distorte o false, invitando il lettore a dubitare e a cogliere gli indizi nel testo.'
      },
      {
        id: 'focalizzazione',
        term: 'Focalizzazione',
        module: 'Modulo 6',
        definition: 'Punto di vista attraverso cui vengono filtrati gli eventi della storia: può essere focalizzazione zero, interna (fissa o polifonica) o esterna.'
      },
      {
        id: 'focalizzazione-zero',
        term: 'Focalizzazione zero',
        module: 'Modulo 6',
        definition: 'Lo sguardo del narratore è illimitato e abbraccia tutto ciò che accade senza un punto di vista definito: il narratore onnisciente sa più dei personaggi.'
      },
      {
        id: 'focalizzazione-interna',
        term: 'Focalizzazione interna',
        module: 'Modulo 6',
        definition: 'Il narratore racconta attraverso gli occhi di un personaggio interno alla narrazione, adottandone il punto di vista e sapendone quanto lui (può essere fissa o polifonica).'
      },
      {
        id: 'focalizzazione-esterna',
        term: 'Focalizzazione esterna',
        module: 'Modulo 6',
        definition: 'La storia è raccontata da un osservatore estraneo che sa meno dei personaggi, non conosce i pensieri e registra solo ciò che si vede e si sente dall\'esterno come una cinepresa.'
      },
      {
        id: 'caratterizzazione',
        term: 'Caratterizzazione dei personaggi',
        module: 'Modulo 7',
        definition: 'Insieme delle caratteristiche che definiscono un personaggio: fisica, psicologica, socio-culturale e ideologica.'
      },
      {
        id: 'flusso-coscienza',
        term: 'Flusso di coscienza',
        module: 'Modulo 7',
        definition: 'Tecnica che registra i pensieri dei personaggi secondo un ordine apparentemente incoerente e casuale, simulandone rapidità e caoticità con assenza di punteggiatura e sintassi irregolare.'
      },
      {
        id: 'monologo-interiore',
        term: 'Monologo interiore',
        module: 'Modulo 7',
        definition: 'Pensieri dei personaggi nella successione spontanea in cui si affacciano alla mente che, a differenza del flusso di coscienza, rispetta le regole sintattiche e conserva coerenza interna.'
      },
      {
        id: 'distanza-narrativa',
        term: 'Distanza narrativa',
        module: 'Modulo 8',
        definition: 'Tempo che separa l\'epoca dei fatti narrati dall\'epoca in cui vengono narrati: può essere minima (presa diretta: presente, passato prossimo, futuro) o massima (passato lontano o fuori dal tempo: imperfetto, passato remoto, trapassati).'
      },
      {
        id: 'stile',
        term: 'Stile',
        module: 'Modulo 10',
        definition: 'Dal latino stilus ("asticella di metallo usata per scrivere incidendo delle tavolette"), è il complesso delle scelte linguistiche e dei mezzi espressivi propri di un singolo autore o di una corrente letteraria.'
      },
      {
        id: 'campo-semantico',
        term: 'Campo semantico',
        module: 'Modulo 10',
        definition: 'Insieme di parole collegate tra loro da una relazione di significato, che rafforzano un concetto e aiutano il lettore a individuare le tematiche del testo.'
      },
      {
        id: 'paratassi',

    function term(glossaryId, customLabel = null) {
      const entry = GLOSSARY_ENTRIES.find((e) => e.id === glossaryId);
      const label = customLabel || (entry ? entry.term : glossaryId);
      return `<span class="glossary-term" data-glossary-id="${glossaryId}" title="Clicca per la definizione nel Glossario">${label}</span>`;
    }

    function renderHighlight(group, key, text, colorClass, activeKey) {
      const isActive = activeKey === key;
      return `<span class="snippet-highlight ${colorClass} ${isActive ? 'active' : ''}" data-hl-group="${group}" data-hl-key="${key}">${text}</span>`;
    }

    function showToast(message) {
      const toast = document.getElementById('statusToast');
      const text = document.getElementById('statusToastText');
      text.textContent = message;
      toast.classList.remove('hidden');
    }

    function openTermPopup(glossaryId) {
      const entry = GLOSSARY_ENTRIES.find((item) => item.id === glossaryId);
      if (!entry) return;
      const popup = document.getElementById('termPopup');
      document.getElementById('termPopupTitle').textContent = entry.term;
      document.getElementById('termPopupDef').textContent = entry.definition;
      document.getElementById('termPopupModule').textContent = entry.module;
      document.getElementById('termPopupOpenGlossaryBtn').dataset.targetTerm = entry.term;
      popup.classList.remove('hidden');
    }

          cardBg: 'bg-sky-50/70 border-sky-300'

    /**

    function renderModule6() {
      const zeroNotes = {
        'zero-0': 'Il narratore conosce il passato del personaggio e fornisce al lettore un\'informazione biografica che va oltre la scena raccontata.',
        'zero-1': 'Il narratore descrive con precisione lo sconvolgimento interiore di Lodovico: riesce a dare un nome e un senso a ciò che il personaggio prova in modo confuso.'

      const innerNotes = {
        'in-0': 'Il giudizio non appartiene a una voce esterna neutrale, ma riproduce direttamente il pensiero frustrato di Arya mentre guarda il proprio lavoro.',
        'in-1': 'Il lettore vede la scena con gli occhi di Arya: non conosce i pensieri di Sansa, ma la vede solamente come appare agli occhi della sorella.'
      };

      const extNotes = {
        'ext-0': 'Il narratore si comporta esattamente come una telecamera: registra solo gesti, dialoghi e dettagli visibili dall\'esterno, senza rivelare nulla dei pensieri o delle intenzioni dei personaggi.',
        'ext-1': 'Il lettore vede due sconosciuti entrare e sedersi al banco, ma non sa chi siano, perché siano lì né che cosa stiano pensando: il narratore non spiega se l\'uomo sia davvero indeciso su cosa mangiare o se stia prendendo tempo.'
      };

      return `
        <div class="mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-rose-900 bg-rose-100 px-3 py-1 rounded-full">Modulo 6</span>

        </div>

        <article class="bg-rose-50/70 rounded-2xl border-2 border-rose-200 p-5 sm:p-6 shadow-xs prose-box">
          <h3 class="font-serif text-xl sm:text-2xl font-bold text-rose-950 mb-1.5">Che cos'è la ${term('focalizzazione')}?</h3>
          <p class="text-sm sm:text-base text-slate-800 leading-relaxed">
            È il punto di vista attraverso cui vengono filtrati gli eventi della storia.
          </p>
        </article>

        <!-- 3 box consecutivi con riquadro esplicativo a fianco del testo SOLO al tocco -->
        <div class="space-y-6 prose-box">
          <!-- 1. Zero -->
          <article class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs">

    /**
     * QUIZ INTERATTIVO
     */
    function renderQuiz() {
      let score = 0;
      QUIZ_QUESTIONS.forEach((q, idx) => {
        if (state.quizAnswers[idx] === q.correct) score += 1;
      });

      return `
        <div class="mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-amber-900 bg-amber-100 px-3 py-1 rounded-full">Verifica Finale</span>
          <h2 class="font-serif text-2xl sm:text-3xl font-bold text-slate-900 mt-2">Quiz Interattivo di Narratologia</h2>
          <p class="text-sm sm:text-base text-slate-600 mt-1">
            Rispondi alle 10 domande basate sui moduli 1–10 e controlla il punteggio finale con le spiegazioni.
          </p>
        </div>

        ${
          state.quizSubmitted
            ? `
          <div class="rounded-2xl bg-gradient-to-r from-indigo-700 to-violet-700 text-white p-5 sm:p-6 shadow-md flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-amber-300">Risultato del Quiz</span>
              <h3 class="font-serif text-2xl font-bold mt-1">Hai totalizzato ${score} su ${QUIZ_QUESTIONS.length}</h3>
              <p class="text-sm text-indigo-100 mt-1">
                ${
                  score >= 8
                    ? 'Ottima padronanza degli strumenti della narratologia!'
                    : score >= 5
                    ? 'Buona base: rivedi le spiegazioni qui sotto per consolidare i concetti.'
                    : 'Puoi ripassare i moduli corrispondenti e riprovare quando vuoi.'
                }
              </p>
            </div>
            <button
              type="button"
              id="resetQuizBtn"
              class="px-4 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-bold text-sm hover:bg-amber-300 transition cursor-pointer shrink-0"
            >
              Ripeti il Quiz
            </button>
          </div>
        `
            : ''
        }

        <div class="space-y-5">
          ${QUIZ_QUESTIONS.map((q, qIdx) => {
            const selectedOpt = state.quizAnswers[qIdx];
            const isCorrect = selectedOpt === q.correct;

            return `
              <article class="bg-white rounded-2xl border border-slate-200 p-5 sm:p-6 shadow-xs prose-box">
                <div class="flex items-center justify-between gap-2 mb-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-indigo-700">Domanda ${qIdx + 1} · ${q.module}</span>
                  ${
                    state.quizSubmitted
                      ? `<span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${
                          isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'
                        }">${isCorrect ? 'Corretta' : 'Da rivedere'}</span>`
                      : ''
                  }
                </div>
                <h3 class="font-serif text-lg sm:text-xl font-bold text-slate-900 mb-4">${q.question}</h3>

                <div class="space-y-2.5">
                  ${q.options
                    .map((opt, oIdx) => {
                      const chosen = selectedOpt === oIdx;
                      let optionStyle = 'border-slate-200 bg-slate-50/70 hover:bg-indigo-50/60 text-slate-800';

                      if (state.quizSubmitted) {
                        if (oIdx === q.correct) {
                          optionStyle = 'border-emerald-600 bg-emerald-50 text-emerald-950 font-semibold';
                        } else if (chosen && oIdx !== q.correct) {
                          optionStyle = 'border-rose-600 bg-rose-50 text-rose-950';
                        }
                      } else if (chosen) {
                        optionStyle = 'border-indigo-600 bg-indigo-50 text-slate-950 font-semibold';
                      }

                      return `
                        <button
                          type="button"
                          data-quiz-q="${qIdx}"
                          data-quiz-opt="${oIdx}"
                          class="w-full text-left px-4 py-3 rounded-xl border text-sm sm:text-base transition cursor-pointer flex items-center gap-3 ${optionStyle}"
                        >
                          <span class="w-6 h-6 rounded-full border border-current flex items-center justify-center text-xs font-bold shrink-0">
                            ${String.fromCharCode(65 + oIdx)}
                          </span>
                          <span>${opt}</span>
                        </button>
                      `;
                    })
                    .join('')}
                </div>

                ${
                  state.quizSubmitted
                    ? `<div class="mt-4 rounded-xl bg-slate-50 border border-slate-200 p-3.5 text-sm text-slate-700 leading-relaxed">
                        <strong class="text-slate-900">Spiegazione:</strong> ${q.explanation}
                      </div>`
                    : ''
                }
              </article>
            `;
          }).join('')}
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 pt-2">
          <div class="text-sm text-slate-600">
            Risposte selezionate: <strong>${Object.keys(state.quizAnswers).length}</strong> su <strong>${QUIZ_QUESTIONS.length}</strong>
          </div>
          <button
            type="button"
            id="submitQuizBtn"
            class="px-6 py-3 rounded-xl bg-indigo-600 text-white font-bold text-sm sm:text-base hover:bg-indigo-700 shadow-sm transition cursor-pointer"
          >
            Verifica risposte e punteggio
          </button>
        </div>
      `;
    }

    function renderCurrentView() {
      const container = document.getElementById('moduleContainer');
      try {
        if (state.currentView === 'quiz') {
          container.innerHTML = renderQuiz();
        } else {
          const map = {
            1: renderModule1,
            2: renderModule2,
            3: renderModule3,
            4: renderModule4,
            5: renderModule5,
            6: renderModule6,
            7: renderModule7,
            8: renderModule8,
            9: renderModule9,
            10: renderModule10
          };
          container.innerHTML = (map[state.currentView] || renderModule1)();
        }
        bindDynamicEvents(container);
      } catch (err) {
        container.innerHTML = `
          <div class="rounded-2xl border border-rose-300 bg-rose-50 p-6 text-rose-900">
            <h3 class="font-serif text-xl font-bold mb-1">Imprevisto nella visualizzazione</h3>
            <p class="text-sm">${err.message || 'Errore durante il caricamento.'}</p>
          </div>
        `;
      }
    }

    function bindDynamicEvents(container) {
      // Termini del glossario
      container.querySelectorAll('.glossary-term[data-glossary-id]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          openTermPopup(el.dataset.glossaryId);
        });
      });

      // Gestore unificato per le espressioni evidenziate con riquadro affiancato
      container.querySelectorAll('.snippet-highlight[data-hl-group]').forEach((el) => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const group = el.dataset.hlGroup;
          const key = el.dataset.hlKey;
          if (group === 'mod2Sommario') state.mod2SommarioNote = state.mod2SommarioNote === key ? null : key;
          else if (group === 'mod2Ellissi') state.mod2EllissiNote = state.mod2EllissiNote === key ? null : key;
          else if (group === 'mod2Analisi') state.mod2AnalisiNote = state.mod2AnalisiNote === key ? null : key;
          else if (group === 'mod2Pausa') state.mod2PausaNote = state.mod2PausaNote === key ? null : key;
          else if (group === 'mod4Sub') state.mod4DescSubNote = state.mod4DescSubNote === key ? null : key;
          else if (group === 'mod5Inner') state.mod5InnerNoteOpen = !state.mod5InnerNoteOpen;
          else if (group === 'mod5Onni') state.mod5OnniNote = state.mod5OnniNote === key ? null : key;
          else if (group === 'mod5Outer') state.mod5OuterNote = state.mod5OuterNote === key ? null : key;
          else if (group === 'mod5Inatt') state.mod5InattNote = state.mod5InattNote === key ? null : key;
          else if (group === 'mod6Zero') state.mod6ZeroNote = state.mod6ZeroNote === key ? null : key;
          else if (group === 'mod6Inner') state.mod6InnerNote = state.mod6InnerNote === key ? null : key;
          else if (group === 'mod6Ext') state.mod6ExtNote = state.mod6ExtNote === key ? null : key;
          else if (group === 'mod7Char') state.mod7CharNote = state.mod7CharNote === key ? null : key;
          else if (group === 'mod8Conn') state.mod8ConnNote = state.mod8ConnNote === key ? null : key;
          else if (group === 'mod9Conn') state.mod9ConnNote = state.mod9ConnNote === key ? null : key;
          else if (group === 'mod10Lex') state.mod10LexNote = state.mod10LexNote === key ? null : key;
          else if (group === 'mod10Reg') state.mod10RegistroNote = state.mod10RegistroNote === key ? null : key;
          renderCurrentView();
        });
      });

      // Modulo 1
      document.getElementById('toggleRulesSidebarBtn')?.addEventListener('click', () => {
        state.mod1RulesOpen = !state.mod1RulesOpen;
        renderCurrentView();
      });
      container.querySelectorAll('[data-mod1-rule]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod1Rule = btn.dataset.mod1Rule;
          renderCurrentView();
        });
      });
      container.querySelector('[data-mod1-type="narrativo"]')?.addEventListener('click', () => {
        state.mod1NarrPurposesOpen = !state.mod1NarrPurposesOpen;
        renderCurrentView();
      });

      // Modulo 2
      container.querySelectorAll('[data-mod2-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod2RhythmTab = btn.dataset.mod2Tab;
          renderCurrentView();
        });
      });
      document.getElementById('toggleScenaNoteBtn')?.addEventListener('click', () => {
        state.mod2ScenaNoteOpen = !state.mod2ScenaNoteOpen;
        renderCurrentView();
      });

      // Modulo 3
      document.getElementById('toggleAnacroniaBtn')?.addEventListener('click', () => {
        state.mod3AnacroniaOpen = !state.mod3AnacroniaOpen;
        renderCurrentView();
      });
      container.querySelectorAll('[data-anacronia]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod3AnacroniaChoice = btn.dataset.anacronia;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-phase-num]').forEach((node) => {
        node.addEventListener('click', () => {
          state.mod3PhaseSelected = Number(node.dataset.phaseNum);
          renderCurrentView();
        });
      });

      // Modulo 4
      container.querySelectorAll('[data-mod4-seq]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod4SeqSelected = btn.dataset.mod4Seq;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-desc-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod4DescMode = btn.dataset.descMode;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mixed-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod4MixedMode = btn.dataset.mixedMode;
          renderCurrentView();
        });
      });

      // Modulo 5
      container.querySelectorAll('[data-mod5-autore]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod5AutoreTab = btn.dataset.mod5Autore;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mod5-lettore]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod5LettoreTab = btn.dataset.mod5Lettore;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mod5-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod5NarratorTab = btn.dataset.mod5Tab;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mod5-inner]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod5InnerSub = btn.dataset.mod5Inner;
          state.mod5InnerNoteOpen = false;
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mod5-outer]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod5OuterSub = btn.dataset.mod5Outer;
          state.mod5OuterNote = null;
          renderCurrentView();
        });
      });

      // Modulo 6
      container.querySelectorAll('[data-mod6-inner]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod6InnerSub = btn.dataset.mod6Inner;
          renderCurrentView();
        });
      });

      // Modulo 7
      container.querySelectorAll('[data-mod7-hier]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.mod7Hier;
          if (val === 'comparse') {
            state.mod7HierarchySelected = null;
          } else {
            state.mod7HierarchySelected = state.mod7HierarchySelected === val ? null : val;
          }
          renderCurrentView();
        });
      });
      container.querySelectorAll('[data-mod7-speech]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod7SpeechTab = btn.dataset.mod7Speech;
          renderCurrentView();
        });
      });
      document.getElementById('toggleSoliloquioBtn')?.addEventListener('click', () => {
        state.mod7SoliloquioNoteOpen = !state.mod7SoliloquioNoteOpen;
        renderCurrentView();
      });

      // Modulo 9
      document.getElementById('denotTextBox')?.addEventListener('click', () => {
        state.mod9DenotNoteOpen = !state.mod9DenotNoteOpen;
        renderCurrentView();
      });

      // Modulo 10
      container.querySelectorAll('[data-lex-id]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod10LexiconSelected = btn.dataset.lexId;
          state.mod10LexNote = null;
          renderCurrentView();
        });
      });
      container.querySelectorAll('.hover-note-wrapper').forEach((wrap) => {
        wrap.addEventListener('click', () => {
          wrap.classList.toggle('open');
        });
      });
      container.querySelectorAll('[data-sem-key]').forEach((el) => {
        el.addEventListener('click', () => {
          const k = el.dataset.semKey;
          state.mod10SemanticNote = state.mod10SemanticNote === k ? null : k;
          renderCurrentView();
        });
      });
      document.getElementById('toggleCoordBtn')?.addEventListener('click', () => {
        state.mod10SyntaxCoordOpen = !state.mod10SyntaxCoordOpen;
        renderCurrentView();
      });
      container.querySelectorAll('[data-coord-tab]').forEach((btn) => {
        btn.addEventListener('click', () => {
          state.mod10SyntaxCoordTab = btn.dataset.coordTab;
          renderCurrentView();
        });
      });
      document.getElementById('toggleSubBtn')?.addEventListener('click', () => {
        state.mod10SyntaxSubOpen = !state.mod10SyntaxSubOpen;
        renderCurrentView();
      });

      // Quiz
      container.querySelectorAll('[data-quiz-q]').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (state.quizSubmitted) return;
          const qIdx = Number(btn.dataset.quizQ);
          const oIdx = Number(btn.dataset.quizOpt);
          state.quizAnswers[qIdx] = oIdx;
          renderCurrentView();
        });
      });

      document.getElementById('submitQuizBtn')?.addEventListener('click', () => {
        if (Object.keys(state.quizAnswers).length < QUIZ_QUESTIONS.length) {
          showToast('Rispondi a tutte le 10 domande prima di verificare il punteggio.');
          return;
        }
        state.quizSubmitted = true;
        renderCurrentView();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      document.getElementById('resetQuizBtn')?.addEventListener('click', () => {
        state.quizAnswers = {};
        state.quizSubmitted = false;
        renderCurrentView();
      });
    }

    /**
     * Glossario completo
     */
    function initGlossaryModal() {
      const modal = document.getElementById('glossaryModal');
      const openBtn = document.getElementById('openGlossaryBtn');
      const closeBtn = document.getElementById('closeGlossaryBtn');
      const searchInput = document.getElementById('glossarySearchInput');
      const moduleFilter = document.getElementById('glossaryModuleFilter');
      const listEl = document.getElementById('glossaryList');

      const modules = [...new Set(GLOSSARY_ENTRIES.map((e) => e.module))];
      modules.forEach((m) => {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        moduleFilter.appendChild(opt);
      });

      function renderGlossaryList() {
        const query = searchInput.value.trim().toLowerCase();
        const mod = moduleFilter.value;

        const filtered = GLOSSARY_ENTRIES.filter((entry) => {
          const matchesMod = mod === 'all' || entry.module === mod;
          const matchesQuery =
            !query ||
            entry.term.toLowerCase().includes(query) ||
            entry.definition.toLowerCase().includes(query);
          return matchesMod && matchesQuery;
        });

        if (filtered.length === 0) {
          listEl.innerHTML = `<p class="text-sm text-slate-500 text-center py-8">Nessun termine trovato per la ricerca inserita.</p>`;
          return;
        }

        listEl.innerHTML = filtered
          .map(
            (entry) => `
          <div class="rounded-2xl border border-slate-200 bg-slate-50/70 p-4 hover:border-indigo-300 transition">
            <div class="flex flex-wrap items-center justify-between gap-2 mb-1">
              <h3 class="font-serif text-lg font-bold text-slate-900">${entry.term}</h3>
              <span class="text-xs font-bold text-indigo-800 bg-indigo-100 px-2.5 py-0.5 rounded-full">${entry.module}</span>
            </div>
            <p class="text-sm text-slate-700 leading-relaxed">${entry.definition}</p>
          </div>
        `
          )
          .join('');
      }

      openBtn.addEventListener('click', () => {
        modal.classList.remove('hidden');
        renderGlossaryList();
        searchInput.focus();
      });

      closeBtn.addEventListener('click', () => modal.classList.add('hidden'));
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.add('hidden');
      });

      searchInput.addEventListener('input', renderGlossaryList);
      moduleFilter.addEventListener('change', renderGlossaryList);

      document.getElementById('termPopupOpenGlossaryBtn').addEventListener('click', (e) => {
        const target = e.currentTarget.dataset.targetTerm || '';
        document.getElementById('termPopup').classList.add('hidden');
        modal.classList.remove('hidden');
        moduleFilter.value = 'all';
        searchInput.value = target;
        renderGlossaryList();
      });
    }

    /**
     * Inizializzazione
     */
    window.addEventListener('DOMContentLoaded', () => {
      const limBtn = document.getElementById('limToggleBtn');
      const limLabel = document.getElementById('limToggleLabel');

      limBtn.addEventListener('click', () => {
        state.limMode = !state.limMode;
        document.documentElement.classList.toggle('lim-mode', state.limMode);
        limBtn.setAttribute('aria-pressed', String(state.limMode));
        if (state.limMode) {
          limBtn.className =
            'px-4 py-2 rounded-xl text-sm font-bold bg-sky-600 text-white border border-sky-700 shadow-sm flex items-center gap-2 cursor-pointer';
          limLabel.textContent = 'Modalità LIM: ON';
          showToast('Modalità LIM attivata: testo ingrandito per la proiezione in classe.');
        } else {
          limBtn.className =
            'px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold border border-sky-300 bg-sky-50 text-sky-900 hover:bg-sky-100 transition flex items-center gap-2 cursor-pointer';
          limLabel.textContent = 'Modalità LIM';
        }
      });

      document.getElementById('brandHomeBtn').addEventListener('click', () => navigateTo(1));
      document.getElementById('closeToastBtn').addEventListener('click', () => {
        document.getElementById('statusToast').classList.add('hidden');
      });
      document.getElementById('closeTermPopupBtn').addEventListener('click', () => {
        document.getElementById('termPopup').classList.add('hidden');
      });

      initGlossaryModal();
      renderSecondaryNav();
      renderCurrentView();
      renderFooterNav();
    });
  </script>
